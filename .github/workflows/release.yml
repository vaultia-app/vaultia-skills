name: Release

# Push a tag such as v0.2.4 to publish a GitHub release:
#   git tag v0.2.4 && git push origin v0.2.4
# The tag must match `version` in pyproject.toml, and CHANGELOG.md must have a
# "## [0.2.4]" section; it becomes the release notes.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and tags, for the "Full Changelog" link

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check tag, version, and changelog
        run: python scripts/release_notes.py --check-tag "$GITHUB_REF_NAME"

      - name: Validate skills
        run: python scripts/validate.py

      - name: Check bundled templates match vaultia-templates@main
        run: python scripts/sync_templates.py --check

      - name: Check generated plugins are up to date
        run: python scripts/build_plugins.py --check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build the plugin zip
        run: |
          python scripts/build_plugins.py --zip
          # Only the bundle plugin is released: one zip with every skill that
          # installs in Claude (claude.ai, Desktop) and ChatGPT / Codex alike.
          mkdir -p release-assets
          cp dist/plugins/vaultia.zip release-assets/vaultia-plugin.zip
          ls -l release-assets

      - name: Write release notes
        run: |
          python scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ## Install

          **Claude Code**
          ```bash
          claude plugin marketplace add vaultia-app/vaultia-skills
          claude plugin install vaultia-skills@vaultia-skills
          ```

          **Codex CLI / ChatGPT**
          ```bash
          codex plugin marketplace add vaultia-app/vaultia-skills
          codex plugin add vaultia-skills@vaultia-skills
          ```

          **Upload:** `vaultia-plugin.zip` works in claude.ai, Claude Desktop, and ChatGPT.
          EOF

          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            link="$repo_url/compare/$previous...$GITHUB_REF_NAME"
          else
            link="$repo_url/commits/$GITHUB_REF_NAME"
          fi
          printf '\n**Full Changelog**: %s\n' "$link" >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::vaultia-plugin.zip was not built"
            exit 1
          fi
          tag="$GITHUB_REF_NAME"

          # 1. Create the release as a draft (or reuse one left by an earlier run).
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" --draft --verify-tag \
              --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          fi

          # 2. Upload each zip, retrying: the upload endpoint can return 404
          #    for a few seconds right after the release is created.
          for file in "${assets[@]}"; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$tag" "$file" --clobber; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::could not upload $file"
                exit 1
              fi
              echo "upload of $file failed (attempt $attempt), retrying..."
              sleep $((attempt * 5))
            done
          done

          # 3. Publish only once every asset is attached.
          gh release edit "$tag" --draft=false --latest
